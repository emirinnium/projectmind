name: Nightly fuzz smoke

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run deterministic bounded fuzz smoke
        env:
          PROJECTMIND_FUZZ_ITERATIONS: '5000'
          PROJECTMIND_FUZZ_SEED: '20260909'
        run: node --max-old-space-size=512 scripts/fuzz-smoke.mjs
      - name: Upload minimized fuzz failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: projectmind-fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore
